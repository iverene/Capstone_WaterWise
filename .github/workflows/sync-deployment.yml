name: Sync Deployment Repositories

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  sync-frontend:
    name: Sync Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Capstone_WaterWise
        uses: actions/checkout@v4

      - name: Clone Deployed_Frontend
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_REPOS_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${DEPLOY_TOKEN}@github.com/JAYCEEHERNANDEZ/Deployed_Frontend.git" \
            deployed-frontend

      - name: Synchronize frontend files
        run: |
          rsync -av --delete \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="node_modules/" \
            --exclude="dist/" \
            --exclude=".env" \
            --exclude=".env.*" \
            frontend/ deployed-frontend/

      - name: Commit and push frontend
        working-directory: deployed-frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all

          if git diff --cached --quiet; then
            echo "No frontend changes to sync."
          else
            git commit -m "Sync frontend from Capstone_WaterWise"
            git push origin main
          fi

  sync-backend:
    name: Sync Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Capstone_WaterWise
        uses: actions/checkout@v4

      - name: Clone Deployed_Backend
        env:
